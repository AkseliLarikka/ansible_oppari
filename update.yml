---
- hosts: all
  become: true
  tasks:
    - name: Päivitetään pakettiluettelot ja asennetaan järjestelmän kaikki päivitykset
      apt:
        update_cache: yes
        upgrade: dist
        autoremove: yes
        autoclean: yes
        allow_downgrades: yes
      tags: system_update

    - name: Tarkistetaan, vaatiiko järjestelmä uudelleenkäynnistyksen
      stat:
        path: /var/run/reboot-required
      register: reboot_required_file
      tags: reboot_check

    - name: Käynnistetään kohdepalvelin uudelleen, jos päivitykset sitä edellyttävät
      reboot:
        msg: "Ansible suorittaa automaattisen uudelleenkäynnistyksen päivitysten asennuksen jälkeen."
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 0
        post_reboot_delay: 30
      when: reboot_required_file.stat.exists
      tags: system_reboot