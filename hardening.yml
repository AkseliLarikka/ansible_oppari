---

- hosts: all
  become: true
  tasks:

    - name: SSH-palvelimen asetusten koventaminen (SSH-7408)
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        backup: yes
      loop:
        - { regexp: '^#?Port', line: 'Port 2222' }
        - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin no' }
        - { regexp: '^#?X11Forwarding', line: 'X11Forwarding no' }
        - { regexp: '^#?ClientAliveInterval', line: 'ClientAliveInterval 300' }
        - { regexp: '^#?ClientAliveCountMax', line: 'ClientAliveCountMax 2' }
        - { regexp: '^#?AllowTcpForwarding', line: 'AllowTcpForwarding no' }
        - { regexp: '^#?LogLevel', line: 'LogLevel VERBOSE' }
        - { regexp: '^#?MaxAuthTries', line: 'MaxAuthTries 3' }
        - { regexp: '^#?MaxSessions', line: 'MaxSessions 2' }
        - { regexp: '^#?TCPKeepAlive', line: 'TCPKeepAlive no' }
        - { regexp: '^#?AllowAgentForwarding', line: 'AllowAgentForwarding no' }
      notify: Restart SSH
      tags: ssh_hardening

    - name: Ytimen koventaminen (KRNL-6000)
      sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: yes
      loop:
        - { name: 'fs.protected_fifos', value: '2' }
        - { name: 'fs.suid_dumpable', value: '0' }
        - { name: 'kernel.kptr_restrict', value: '2' }
        - { name: 'kernel.sysrq', value: '0' }
        - { name: 'kernel.unprivileged_bpf_disabled', value: '1' }
        - { name: 'net.core.bpf_jit_harden', value: '2' }
        - { name: 'net.ipv4.conf.all.forwarding', value: '0' }
        - { name: 'net.ipv4.conf.all.log_martians', value: '1' }
        - { name: 'net.ipv4.conf.all.rp_filter', value: '1' }
        - { name: 'net.ipv4.conf.default.log_martians', value: '1' }
      tags: kernel_hardening

    - name: Estetään tarpeettomien verkkoprotokollien käyttö (NETW-3200)
      lineinfile:
        path: /etc/modprobe.d/cis.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        create: yes
      loop:
        - { regexp: '^#?install dccp', line: 'install dccp /bin/true' }
        - { regexp: '^#?install sctp', line: 'install sctp /bin/true' }
        - { regexp: '^#?install rds', line: 'install rds /bin/true' }
        - { regexp: '^#?install tipc', line: 'install tipc /bin/true' }
      tags: disable_unnecessary_protocols

    - name: Estetään CUPS-palvelimen käyttö (PRNT-2307)
      apt:
        name: 
          - cups
          - cups-daemon
        state: purged
        autoremove: yes
      tags: cups_disable
    
    - name: Aseta /etc/login.defs-tiedostoon umask 027 (AUTH-9328) ja tiivistekierrokset (AUTH-9230)
      lineinfile:
        path: /etc/login.defs
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        backup: yes
      loop:
        - { regexp: '^UMASK', line: 'UMASK 027' }
        - { regexp: '^SHA_CRYPT_MIN_ROUNDS', line: 'SHA_CRYPT_MIN_ROUNDS 10000' }
        - { regexp: '^SHA_CRYPT_MAX_ROUNDS', line: 'SHA_CRYPT_MAX_ROUNDS 100000' }
      tags: login_defs

    - name: Tietoturvapakettien asentaminen (DEB-0280, DEB-0880, HRDN-7230, PKGS-7392, PKGS-7394)
      apt:
        name:
          - libpam-tmpdir
          - fail2ban
          - rkhunter
          - unattended-upgrades
          - apt-show-versions
        state: present
        update_cache: yes
      tags: apt_hardening

    - name: Kääntäjien käyttöoikeuksien rajaaminen pääkäyttäjälle (HRDN-7222)
      file:
        path: "{{ item }}"
        owner: root
        group: root
        mode: '0750'
      loop:
        - /usr/bin/gcc
        - /usr/bin/cc
      ignore_errors: yes
      tags: compiler_hardening

    - name: Lakisääteisten varoitustekstien lisääminen (BANN-7126, BANN-7130)
      copy:
        dest: "{{ item }}"
        content: |
          WARNING: This system is for the use of authorized users only.
          Activities on this system are monitored and recorded.
          Unauthorized access will be investigated and reported.
        owner: root
        group: root
        mode: '0644'
      loop:
        - /etc/issue
        - /etc/issue.net
      tags: banner_hardening
